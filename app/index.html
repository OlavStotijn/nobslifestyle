<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta id="theme-color-meta" name="theme-color" content="#0f0f0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NoBS" />
    <meta name="google-site-verification" content="2aOwCm46T3HG5ozdr7JYPBTZCJBEfR_KyrUSqQiRFuw" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <title>NoBSLifestyle</title>
    <script>
      // Applied synchronously, before first paint, so there's no flash of
      // the wrong theme while React boots — ThemeProvider takes over from
      // here and keeps this class + the meta tag above in sync afterwards.
      (function () {
        var stored = localStorage.getItem("nobs-theme");
        if (stored !== "light") document.documentElement.classList.add("dark");
        var accent = localStorage.getItem("nobs-accent");
        if (accent === "blue" || accent === "purple") document.documentElement.classList.add("accent-" + accent);
      })();
    </script>
  </head>
  <body class="bg-bg text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
